_ > nanoagent.plugin.v0001.ManifestConfig:
id: chess-forced-mate
name: Chess Forced Mate
version: 0.1.1
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  find_forced_mate:
    description: Find a forced checkmate for the side to move within 1, 2, or 3 attacker moves from a complete standard FEN. Return a complete-defense strategy certificate and illustrative mate line, or a checkable no-mate-within-bound certificate. Resource exhaustion raises undecided, never no mate.
  check_mate_line:
    description: Check 0 to 12 ordered UCI moves from a complete standard FEN. Identify the first illegal move, replay the legal prefix, and report final checkmate and winner. A legal mating line alone does not prove forced mate against other defenses.

tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  forced-mate:
    description: >-
      Find forced mate within 1-3 attacker turns from complete standard FEN;
      default to 1 only when unspecified. ROUTE, CALL, SUMMARIZE. This Python
      task searches and independently verifies chess; do not guess moves,
      recalculate attacks, or replay proof nodes in your reasoning. Require
      supplied castling/en-passant rights; clarify missing facts, never ask for
      JSON. Call the requested bound once; shorter horizons are searched internally.
      Compare multiple bounds only when explicitly requested.
      If verdict.valid is true, use output directly. On success, report first_move
      and one output.line; the certificate covers every legal defense. A first
      move in a longer mate may be quiet. If a separate line audit is requested,
      immediately call mate-line once with the ORIGINAL FEN and EXACT moves from
      output.line. Never substitute a guess or claim an unreturned checker result.
      Negative means no forced mate within the bound; a budget error is undecided;
      a failed verdict is unverified. Finish in at most 100 words, with brief
      standard notation if requested. No repeated self-correction or identical
      calls. State briefly that repetition/move-count draws and prior-history
      reconstruction are excluded. No Chess960 or general best-move evaluation.
    runner: tool
    tools: [find_forced_mate]
    reference: null
    instructions: >-
      Search all legal move types to a bounded alternating horizon. Prove attacker
      choices existentially and defender replies universally, with the quantifiers
      reversed for escape certificates. Every positive leaf must be actual
      checkmate of the defender, and all edges must be legal from their preceding
      positions. The independent verifier uses its own standard-library board
      rules, not the runtime chess library. At most 50000 searched positions and
      4096 certificate nodes are supported; exceeding either raises an explicit
      undecided error without a fabricated verdict. Puzzle rules ignore repetition
      and move-count draws, and treat detected insufficient material as terminal.
  mate-line:
    description: >-
      Check up to 12 UCI moves from complete standard FEN. Copy the supplied moves
      in order; for a solver line, use its ORIGINAL FEN and EXACT output.line moves.
      Clarify missing facts; never ask for JSON or substitute guessed candidates.
      CALL ONCE, THEN REPORT. Python and the independent verifier do the chess;
      do not recalculate attacks or alternatives. If verdict.valid is true, report
      legal, first_illegal_index if any, ends_in_checkmate, and winner directly.
      A valid verdict certifies the analysis, not a win. Say checkmate ONLY when
      ends_in_checkmate is true. is_mating_line also requires the original side
      to win. A mating line alone does not prove force. Finish under 100 words;
      no repeated checks or promises of another call. History-free puzzle rules
      exclude repetition/move-count adjudication and retrograde reachability.
    runner: tool
    tools: [check_mate_line]
    reference: null
    instructions: >-
      Independently check each move from its preceding legal position, stop before
      the first illegal move, and return all legal-prefix FENs with check/mate
      flags. Final FEN is after that prefix. ends_in_checkmate and winner must be
      false/null if any supplied move is illegal, even if the legal prefix ended
      in mate. Checkmate requires the king in check and NO legal response;
      stalemate is not mate. Verify every returned field using independent rules.
