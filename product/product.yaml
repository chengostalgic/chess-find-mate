_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Find a mate. Check every defense."
summary: >-
  Solve standard-chess mate-in-one puzzles and bounded mate-in-two or three.
  Get a ready answer, an automatically checked mating line, and a complete-defense
  certificate in one call, or check your own proposed continuation separately.
highlights:
  - "Find a forced mate, with every legal defense covered."
  - "Search, audit the winning line, and format the answer in one call."
  - "Handle castling, en passant, pins, and all promotion choices."
  - "Explore board diagrams and independently checked mate evidence."
steps:
  - "Supply a FEN or describe the pieces, side to move, and special-move rights."
  - "Ask for mate within one, two, or three moves, or provide a continuation."
  - "Inspect the move, board sequence, and checked defense certificate."
